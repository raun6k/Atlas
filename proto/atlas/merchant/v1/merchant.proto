}

message GetOperationTimelineRequest {
  RequestMeta meta = 1;
  string operation_id = 2;
}

message AssuranceStage {
  string stage = 1;
  bool reached = 2;
  bool authoritative = 3;
  string note = 4;
}

message GetOperationTimelineResponse {
  Envelope envelope = 1;
  repeated AuditEvent events = 2;
  repeated AssuranceStage stages = 3;
}

message GetResourceTimelineRequest {
  RequestMeta meta = 1;
  string resource_type = 2;
  string resource_id = 3;
}

message GetResourceTimelineResponse {
  Envelope envelope = 1;
  repeated AuditEvent events = 2;
}

message CreateAuditExportRequest {
  RequestMeta meta = 1;
  string format = 2; // CSV_SUMMARY | JSON_SAFE_DETAIL
  string filter_json = 3;
}

message CreateAuditExportResponse {
  Envelope envelope = 1;
  string export_id = 2;
  string status = 3;
}

message GetAuditExportRequest {
  RequestMeta meta = 1;
  string export_id = 2;
}

message GetAuditExportResponse {
  Envelope envelope = 1;
  string export_id = 2;
  string status = 3;
  string download_path = 4;
  string artifact_digest = 5;
}

message ListOperationsRequest {
  RequestMeta meta = 1;
}

message JobRow {
  string job_id = 1;
  string job_type = 2;
  string status = 3;
  string operation_id = 4;
  int32 attempt_count = 5;
  string last_error_class = 6;
  string next_retry_at = 7;
  string lease_owner = 8;
  string lease_expires_at = 9;
  bool retryable = 10;
  string dead_letter_reason = 11;
  string operator_action = 12;
  string last_error = 13;
}

message ListOperationsResponse {
  Envelope envelope = 1;
  repeated JobRow jobs = 2;
}

message ReconcileOperationRequest {
  RequestMeta meta = 1;
  string operation_id = 2;
}

message ReconcileOperationResponse {
  Envelope envelope = 1;
  bool scheduled = 2;
  string status = 3;
  string job_id = 4;
  string code = 5;
}

message HealthComponent {
  string name = 1;
  string status = 2;
  string detail = 3;
  string evidence_status = 4;
}

message SystemHealthResponse {
  Envelope envelope = 1;
  string status = 2;
  bool database = 3;
  bool migrations = 4;
  repeated HealthComponent components = 5;
}

message OutcomeMetric {
  string name = 1;
  bool eligible = 2;
  string evidence_status = 3;
  int64 value = 4;
  bool value_present = 5;
  int32 numerator = 6;
  int32 denominator = 7;
  bool ratio_present = 8;
}

message GetMerchantOutcomesRequest {
  RequestMeta meta = 1;
}

message GetMerchantOutcomesResponse {
  Envelope envelope = 1;
  repeated OutcomeMetric metrics = 2;
}

service AdminService {
  rpc GetMerchantProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateMerchantProfile(UpdateProfileRequest) returns (GetProfileResponse);
  rpc ListLocations(GetProfileRequest) returns (ListLocationsResponse);
  rpc GetLocation(GetLocationRequest) returns (LocationResponse);
  rpc UpdateLocation(UpdateLocationRequest) returns (LocationResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProductAdmin(GetProductRequest) returns (GetProductResponse);
  rpc ListSkus(ListSkusRequest) returns (ListSkusResponse);
  rpc GetSku(GetSkuRequest) returns (GetSkuResponse);
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);
  rpc AdjustInventory(AdjustInventoryRequest) returns (ListInventoryResponse);
  rpc ImportInventory(ImportInventoryRequest) returns (ImportInventoryResponse);
  rpc ListRelationships(GetProfileRequest) returns (ListRelationshipsResponse);
  rpc ListPromotions(GetProfileRequest) returns (ListPromotionsResponse);
  rpc UpdatePromotion(UpdatePromotionRequest) returns (ListPromotionsResponse);
  rpc ListStrategies(GetProfileRequest) returns (ListStrategiesResponse);
  rpc UpdateStrategies(UpdateStrategiesRequest) returns (ListStrategiesResponse);
  rpc PreviewRules(PreviewRulesRequest) returns (PreviewRulesResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSessionAdmin(GetSessionRequest) returns (GetSessionResponse);
  rpc GetCartAdmin(GetCartByIDRequest) returns (GetCartResponse);
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrderAdmin(GetOrderAdminRequest) returns (GetOrderResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc ListHosts(GetProfileRequest) returns (ListHostsResponse);
  rpc GetHost(GetHostRequest) returns (ListHostsResponse);
  rpc GetAttention(GetProfileRequest) returns (GetAttentionResponse);
  rpc SearchResources(ResourceSearchRequest) returns (ResourceSearchResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc ReconcileOperation(ReconcileOperationRequest) returns (ReconcileOperationResponse);
  rpc GetSystemCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc GetSystemHealth(GetProfileRequest) returns (SystemHealthResponse);
  rpc GetMerchantOutcomes(GetMerchantOutcomesRequest) returns (GetMerchantOutcomesResponse);
}

service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc GetAuditEvent(GetAuditEventRequest) returns (GetAuditEventResponse);
  rpc GetOperationTimeline(GetOperationTimelineRequest) returns (GetOperationTimelineResponse);
  rpc GetResourceTimeline(GetResourceTimelineRequest) returns (GetResourceTimelineResponse);
  rpc CreateAuditExport(CreateAuditExportRequest) returns (CreateAuditExportResponse);
  rpc GetAuditExport(GetAuditExportRequest) returns (GetAuditExportResponse);
}

message ClaimJobRequest {
  string worker_id = 1;
  repeated string job_types = 2;
}

message ClaimJobResponse {
  string job_id = 1;
  string job_type = 2;
  string payload_json = 3;
  string operation_id = 4;
}

message CompleteJobRequest {
  string job_id = 1;
  string worker_id = 2;
  string result_json = 3;
}

message FailJobRequest {
  string job_id = 1;
  string worker_id = 2;
  string error_code = 3;
}

service WorkerService {
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  rpc CompleteJob(CompleteJobRequest) returns (AdminEmpty);
  rpc FailJob(FailJobRequest) returns (AdminEmpty);
}
