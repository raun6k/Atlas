  int64 record_sequence = 2;
  string event_kind = 3;
  string occurred_at = 4;
  string request_id = 5;
  string operation_id = 6;
  string action = 7;
  string primary_resource_type = 8;
  string primary_resource_id = 9;
  string summary_sentence = 10;
  string attention_code = 11;
  string event_body_json = 12;
  map<string, string> correlation = 13;
  bool non_authoritative = 14;
  string source_channel = 15;
}

message ListAuditEventsResponse {
  Envelope envelope = 1;
  repeated AuditEvent events = 2;
  string next_cursor = 3;
  int32 active_filter_count = 4;
}

message GetAuditEventRequest {
  RequestMeta meta = 1;
  string audit_event_id = 2;
}

message GetAuditEventResponse {
