message AttentionSummary {
  string completeness = 1;
  int32 unresolved_money = 2;
  int32 evidence_rejected = 3;
  int32 authorization_security = 4;
  int32 commerce_replan = 5;
  int32 recovery_delayed = 6;
  string headline = 7;
  int32 captured_unbound = 8;
  int32 failed_job = 9;
  int32 inventory_hold_leak = 10;
  int32 stale_strategy = 11;
  int32 incomplete_merchant_data = 12;
  int32 missing_evaluation_evidence = 13;
